<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROGYA - Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-screen">
        <div class="auth-container">

            <header class="auth-brand">
                <h1>AROGYA</h1>
                <p>SMART HOSPITAL MANAGEMENT AND EMERGENCY TRIAGE SYSTEM</p>
            </header>

            <section class="auth-card">

                <h2 id="form-title">Welcome Back</h2>

                <p class="auth-description" id="form-description">
                    Sign in to continue to your healthcare portal.
                </p>

                <form id="login-form">

                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="auth-field" id="role-field" hidden>
                        <label for="role">Account Type</label>
                        <select id="role">
                            <option value="Patient">Patient</option>
                            <option value="Doctor">Doctor</option>
                            <option value="Nurse">Nurse</option>
                            <option value="Receptionist">Receptionist</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <button type="submit" class="auth-submit" id="submit-button">
                        Sign In
                    </button>

                </form>

                <p class="auth-message" id="message" role="status"></p>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <p class="auth-switch-text" id="switch-text">
                    New to AROGYA?
                    <button type="button" id="switch-mode">Create Account</button>
                </p>

                <a href="welcome.html" class="back-home">
                    ← Back to Home
                </a>

            </section>

            <footer class="auth-footer">
                Caring for lives, connecting healthcare.
                <br>
                By Team KAIZEN
            </footer>

        </div>
    </main>

    <script>
        let registerMode = false;

        const form = document.getElementById("login-form");
        const title = document.getElementById("form-title");
        const description = document.getElementById("form-description");
        const submitButton = document.getElementById("submit-button");
        const switchButton = document.getElementById("switch-mode");
        const switchText = document.getElementById("switch-text");
        const roleField = document.getElementById("role-field");
        const message = document.getElementById("message");
        const password = document.getElementById("password");

        switchButton.addEventListener("click", function () {
            registerMode = !registerMode;

            title.textContent = registerMode
                ? "Create Your Account"
                : "Welcome Back";

            description.textContent = registerMode
                ? "Join AROGYA for smarter healthcare management."
                : "Sign in to continue to your healthcare portal.";

            submitButton.textContent = registerMode
                ? "Create Account"
                : "Sign In";

            switchText.firstChild.textContent = registerMode
                ? "Already have an account? "
                : "New to AROGYA? ";

            switchButton.textContent = registerMode
                ? "Sign In"
                : "Create Account";

            roleField.hidden = !registerMode;
            message.textContent = "";
            password.value = "";
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const pass = password.value;

            const data = new URLSearchParams();

            data.append("username", username);
            data.append("password", pass);

            if (registerMode) {
                data.append("role", document.getElementById("role").value);
            }

            submitButton.disabled = true;
            message.textContent = "Please wait...";

            try {
                const response = await fetch(
                    registerMode ? "/register" : "/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: data.toString()
                    }
                );

                const result = await response.json();

                message.textContent = result.message;

                if (result.status === "success" && registerMode) {
                    registerMode = false;

                    title.textContent = "Welcome Back";
                    description.textContent =
                        "Your account is ready. Sign in to continue.";

                    submitButton.textContent = "Sign In";

                    switchText.firstChild.textContent = "New to AROGYA? ";
                    switchButton.textContent = "Create Account";

                    roleField.hidden = true;
                    form.reset();
                } else if (result.status === "success") {
                    message.textContent =
                        result.message + " Your account type: " + result.role;
                }

            } catch (error) {
                message.textContent =
                    "Unable to connect to AROGYA. Please check the server.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
